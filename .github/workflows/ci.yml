name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify modules
        run: |
          go mod download
          go mod verify
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - name: Vet
        run: make vet
      - name: Race tests
        run: make race
      - name: Build
        run: make build
      - name: Build without cgo
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/session-pressure

  desktop:
    name: desktop
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          persist-credentials: false
      - name: Swift tests
        run: make -C apps/SessionPressure test

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz -C /tmp gitleaks
      - name: Secret scan
        run: /tmp/gitleaks detect --source . --no-git --redact

  public-hygiene:
    name: public hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Private-name scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUBLIC_CHECK_PATTERNS: ${{ secrets.PUBLIC_CHECK_PATTERNS }}
        run: |
          if [ -z "$PUBLIC_CHECK_PATTERNS" ]; then
            if [ "$EVENT_NAME" = pull_request ]; then
              echo "::notice::PUBLIC_CHECK_PATTERNS is not available to this pull request; the push to main runs the scan"
              exit 0
            fi
            echo "::error::secret PUBLIC_CHECK_PATTERNS is not set; this public repository fails CI without the private-name check"
            exit 1
          fi
          patterns="$RUNNER_TEMP/public-check-patterns.txt"
          printf '%s\n' "$PUBLIC_CHECK_PATTERNS" > "$patterns"
          NICOS_PUBLIC_CHECK_PATTERNS="$patterns" perl scripts/public-hygiene-scan release HEAD
