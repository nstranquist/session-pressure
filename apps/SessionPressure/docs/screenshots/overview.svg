<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="780" viewBox="0 0 1180 780">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1c1e"/>
      <stop offset="100%" stop-color="#121214"/>
    </linearGradient>
    <filter id="soft" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1180" height="780" fill="url(#bg)"/>
  <!-- titlebar -->
  <rect width="1180" height="52" fill="#2a2a2c"/>
  <circle cx="22" cy="26" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="26" r="6" fill="#febc2e"/>
  <circle cx="62" cy="26" r="6" fill="#28c840"/>
  <text x="590" y="32" text-anchor="middle" fill="#e5e5ea" font-family="SF Pro Text, Helvetica, Arial" font-size="13">NDev Pressure</text>
  <text x="980" y="32" fill="#8e8e93" font-family="SF Pro Text, Helvetica, Arial" font-size="11">Refresh   Live sample</text>

  <!-- sidebar -->
  <rect x="0" y="52" width="220" height="728" fill="#242426"/>
