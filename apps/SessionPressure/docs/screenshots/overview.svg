    <g font-family="SF Mono, Menlo, monospace" font-size="11" fill="#aeaeb2">
      <circle cx="28" cy="520" r="4" fill="#59b8f2"/>
      <text x="42" y="524" fill="#f2f2f7" font-family="SF Pro Text, Helvetica, Arial" font-size="12" font-weight="600">codex</text>
      <text x="100" y="524">pid 10230 · 13 procs · q 121</text>
      <text x="820" y="524" fill="#f2f2f7" font-weight="600">732 MiB</text>

      <circle cx="28" cy="552" r="4" fill="#59b8f2"/>
      <text x="42" y="556" fill="#f2f2f7" font-family="SF Pro Text, Helvetica, Arial" font-size="12" font-weight="600">codex</text>
      <text x="100" y="556">pid 41376 · 30 procs · q 121</text>
      <text x="820" y="556" fill="#f2f2f7" font-weight="600">429 MiB</text>

      <circle cx="28" cy="584" r="4" fill="#59b8f2"/>
      <text x="42" y="588" fill="#f2f2f7" font-family="SF Pro Text, Helvetica, Arial" font-size="12" font-weight="600">codex</text>
      <text x="100" y="588">pid 71664 · 15 procs · q 121</text>
