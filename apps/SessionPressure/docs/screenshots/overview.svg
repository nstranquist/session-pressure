    <rect x="10" y="130" width="200" height="30" rx="6" fill="#3a3a3c"/>
    <text x="28" y="150" fill="#f2f2f7">Overview</text>
    <text x="28" y="184" fill="#aeaeb2">Agent Trees</text>
    <text x="28" y="218" fill="#aeaeb2">Work Queue</text>
    <text x="28" y="252" fill="#aeaeb2">Policy</text>
    <text x="28" y="286" fill="#aeaeb2">Monitor</text>
    <text x="28" y="320" fill="#aeaeb2">Idle Cleanup</text>
