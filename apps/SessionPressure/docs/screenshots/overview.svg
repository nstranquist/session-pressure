  <circle cx="28" cy="730" r="4" fill="#22c55e"/>
  <text x="40" y="734" fill="#8e8e93" font-family="SF Pro Text, Helvetica, Arial" font-size="11">Live</text>
  <text x="24" y="756" fill="#636366" font-family="SF Mono, Menlo, monospace" font-size="10">free 49% · cpu 41% · 17 trees</text>

  <!-- main content -->
  <g transform="translate(236,68)">
