      <circle cx="28" cy="616" r="4" fill="#59b8f2"/>
      <text x="42" y="620" fill="#f2f2f7" font-family="SF Pro Text, Helvetica, Arial" font-size="12" font-weight="600">codex</text>
      <text x="100" y="620">pid 49375 · 8 procs · q 121</text>
