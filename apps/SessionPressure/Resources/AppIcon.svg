<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="gauge" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="55%" stop-color="#eab308"/>
      <stop offset="80%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>
  <!-- outer arc track -->
  <path d="M212 680 A320 320 0 1 1 812 680" fill="none" stroke="#334155" stroke-width="56" stroke-linecap="round"/>
  <!-- pressure arc -->
  <path d="M212 680 A320 320 0 1 1 760 360" fill="none" stroke="url(#gauge)" stroke-width="56" stroke-linecap="round"/>
  <!-- needle hub -->
  <circle cx="512" cy="560" r="36" fill="#e2e8f0"/>
  <circle cx="512" cy="560" r="16" fill="#0f172a"/>
  <!-- needle -->
  <path d="M512 560 L700 300" stroke="#f8fafc" stroke-width="28" stroke-linecap="round"/>
  <!-- ticks -->
  <circle cx="280" cy="620" r="10" fill="#22c55e"/>
  <circle cx="360" cy="360" r="10" fill="#eab308"/>
  <circle cx="640" cy="300" r="10" fill="#f97316"/>
  <circle cx="760" cy="520" r="10" fill="#ef4444"/>
</svg>
