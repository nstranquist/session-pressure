[workspace]
members = ["crates/pressure-core", "crates/session-pressure-ui"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pressure-core = { path = "crates/pressure-core" }
