schema_version: nicos.commit-delivery.policy.v1
repository_id: session-pressure
target_ref: refs/heads/main
agent_auto_delivery: true
legacy_queue_retired: true
maximum_paths: 2000
maximum_commits: 200
# Capture runs the repo-owned hook (.ndev/hooks/pre-commit, installed as
# .git/hooks/pre-commit). Its capture profile refuses private host names,
# private paths, the private workers.dev handle and secrets in added lines,
# because this repository is public. Working papers live in a private
# repository, so the hook also refuses new files under corpus/ and docs/
# active, audits and reviews.
# No tier: capture also runs go vet on the Mac for the captured packages, so
# the Darwin-only files (cgo NVMe reader, *_darwin.go and their tests) are
# type-checked before acceptance.
capture_checks:
  hook_profile: capture
  timeout_ms: 30000
  go_vet:
    - module: .
append_merge:
  - CHANGELOG.md
  - "docs/**/*.md"
remote:
  require_visibility: PUBLIC
gate_delegation:
  remote_pass:
    - argv: [go, test, -count=1, -timeout, 10m, ./...]
      directory: .
      platforms: [linux/amd64]
      reason: Portable Go tests run on the active Linux gate runner; the Darwin-only checks below stay on the Mac.
    - argv: [go, vet, ./...]
      directory: .
      platforms: [linux/amd64]
      reason: Portable static analysis runs on the active Linux gate runner; it does not cover Darwin-only files.
verification:
  schema_version: nicos.commit-delivery.repository-verification.v1
  required:
    # Same argv as gate_delegation.remote_pass, so the active Linux gate runner
    # runs them. They do not prove Darwin behavior.
    - id: go-tests
      adapter: go
      command:
        argv: [go, test, -count=1, -timeout, 10m, ./...]
        directory: .
        timeout_ms: 900000
      platforms: [linux/amd64]
    - id: go-vet
      adapter: go
      command:
        argv: [go, vet, ./...]
        directory: .
        timeout_ms: 900000
      platforms: [linux/amd64]
    # Darwin runtime tests of ./sessionpressure, scoped to that directory.
    # -short keeps every correctness check and drops only the live-host
    # budgets (native inventory latency, sampler duration, resident RSS, the
    # 64-sample CPU soak, live phase timing), because on a loaded worker host
    # they measure the host's load, not the code. Real-time waits in these
    # tests are condition-driven or use an injected wait deadline,
    # so host load makes them slower, not red. make test and make
    # publish-ready run the full set, budgets included.
    - id: darwin-sessionpressure-tests
      adapter: go
      command:
        argv: [go, test, -short, -count=1, -timeout, 15m, .]
        directory: sessionpressure
        timeout_ms: 1200000
      platforms: [darwin/arm64]
      paths: [sessionpressure]
    - id: darwin-helpermain-tests
      adapter: go
      command:
        argv: [go, test, -count=1, .]
        directory: internal/helpermain
        timeout_ms: 300000
      platforms: [darwin/arm64]
      paths: [internal/helpermain]
    - id: macos-app-tests
      adapter: swift
      command:
        argv: [swift, test]
        directory: apps/SessionPressure
        timeout_ms: 1200000
      platforms: [darwin/arm64]
      paths: [apps/SessionPressure]
  exemptions:
    - adapter: node
      reason: The repository has no package.json or JavaScript sources.
    - adapter: python
      reason: The two Python files are a release-time SVG-to-PNG helper and verify-installed-lifecycle.py, a live check against an installed app; neither is a candidate check.
    - adapter: docs
      reason: The Markdown docs have no repository-owned checker yet; the capture hook checks them for private names and secrets.
